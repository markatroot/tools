<header class="app-header">
  <span class="logo"
    ><svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
      /></svg
  ></span>
  <span class="title">IP Reputation Check</span>
  <span class="sub">AbuseIPDB</span>
  @if (store.rateLimit(); as rl) {
    <span class="quota"
      >Daily quota {{ rl.limit - rl.remaining }} / {{ rl.limit }}</span
    >
  }
</header>
<ip-lookup-page />
