<label for="api-key">API key <span class="req">*</span></label>
<div class="shell">
  <span class="icon"
    ><svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
      />
      <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></svg
  ></span>
  <input
    id="api-key"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    (input)="onInput($event)"
    placeholder="Paste your AbuseIPDB key"
    autocomplete="off"
    spellcheck="false"
  />
  <button
    type="button"
    class="reveal"
    (click)="visible.set(!visible())"
    [attr.aria-label]="visible() ? 'Hide key' : 'Show key'"
    [title]="visible() ? 'Hide key' : 'Show key'"
  >
    @if (visible()) {
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
      />
      <path
        d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"
      />
      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
      <path d="m2 2 20 20" />
    </svg>
    } @else {
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"
      />
      <circle cx="12" cy="12" r="3" />
    </svg>
    }
  </button>
</div>
<div class="hint">
  <span [class]="status().tone">{{ status().text }}</span>
  <a href="https://www.abuseipdb.com/api.html" target="_blank" rel="noopener"
    >Get a key</a
  >
</div>
